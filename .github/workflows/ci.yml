name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          test -f README.md
          test -f HISTORY.md
          test -f SKILLS.md
          test -f docs/01-business-goals.md
          test -f docs/02-system-architecture.md
          test -f docs/03-roadmap.md
          test -f docs/demo-v1.md
          test -f docs/adr/0001-orchestrator-openclaw.md
          test -f assets/architecture-v1.png

      - name: Check for unresolved template placeholders
        run: |
          if grep -R "__[A-Z0-9_][A-Z0-9_]*__" -- . \
            --exclude-dir=.git \
            --exclude='*.png'; then
            echo "Found unresolved template placeholders"
            exit 1
          fi

      - name: Check Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".markdown-link-check.json"

  release:
    needs: [validate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "Release ${TAG}"
            echo
            echo "See README.md, HISTORY.md, and docs/03-roadmap.md for the current project scope."
          } > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TazAIplatform ${{ github.ref_name }}"
          body_path: release_notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
